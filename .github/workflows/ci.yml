name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://pypi.jitx.com/jitx/main/+simple -e ".[dev]" "jitx==4.4.2"

      - name: Ruff check
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Pyright
        run: python -m pyright --pythonpath "$(command -v python)"

      - name: Pytest
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*

      - name: Check installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/mechanical-wheel"
          "$RUNNER_TEMP/mechanical-wheel/bin/pip" install --extra-index-url https://pypi.jitx.com/jitx/main/+simple dist/*.whl "jitx==4.4.2" "jitxlib-standard==4.4.0" pytest
          cp tests/test_plugin.py "$RUNNER_TEMP/test_mechanical_plugin.py"
          cd "$RUNNER_TEMP"
          mechanical-wheel/bin/python -m pytest test_mechanical_plugin.py -q
          mechanical-wheel/bin/python -c 'import jitxlib.mechanical, jitxlib.symbols'

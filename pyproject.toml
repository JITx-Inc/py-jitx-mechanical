[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.5,<0.6"]
build-backend = "hatchling.build"

[project]
name = "jitxlib-mechanical"
dynamic = ["version"]
description = "Mechanical import and export helpers for JITX Python projects"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "JITX Inc."}
]
dependencies = [
    "jitx>=4.6.0,<5",
    "jitxcore>=4.6.0,<5",
    "ezdxf>=1.4,<2",
]
keywords = ["jitx", "pcb", "eda", "dxf", "emn", "idf", "idx", "mechanical"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15", "pyright>=1.1", "build>=1.2", "twine>=6"]

[project.entry-points.jitx-plugin]
export = "jitxlib.mechanical.plugin"

[project.scripts]
jitx-mechanical = "jitxlib.mechanical.cli:main"

[project.urls]
Source = "https://github.com/JITx-Inc/py-jitx-mechanical"
Documentation = "https://docs.jitx.com/"

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel]
packages = ["src/jitxlib"]
core-metadata-version = "2.4"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+undefined"

# Environments run by jitx-inc/pybuild-action in the release workflow:
# "hatch fmt --check", "hatch run types:check", and "hatch test --cover".
[tool.hatch.envs.hatch-static-analysis]
dependencies = ["ruff>=0.15"]
config-path = "none"

[tool.hatch.envs.types]
extra-dependencies = ["pyright>=1.1"]

[tool.hatch.envs.types.scripts]
check = "pyright"

[tool.hatch.envs.hatch-test]
installer = "pip"
dependencies = ["coverage[toml]", "pytest>=8", "pytest-cov"]

[[tool.hatch.envs.test.matrix]]
python = ["3.12", "3.13", "3.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    'error:design\.(nets|layers)\(\) is deprecated:RuntimeWarning',
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src/jitxlib/mechanical"]
